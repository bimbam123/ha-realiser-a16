version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Test requirements: pytest-homeassistant-custom-component pins the
  # Home Assistant version the integration tests run against. A new
  # version usually follows each monthly Home Assistant release.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      test-requirements:
        patterns:
          - "*"
