[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
# Explicit timeout parameters are part of the public API (HA ignores it too).
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110"]

[tool.ruff.lint.isort]
known-first-party = ["pya16", "conftest", "custom_components"]
